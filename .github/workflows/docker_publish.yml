name: Docker image

# Builds the image from the Dockerfile and pushes it to the GitHub Container Registry
# (ghcr.io/jt-ito/tsundoku). Pushing needs no secrets: the workflow token is enough.
#   v* tag       -> :<version>, :<major>.<minor> and :latest
#   push/manual  -> :edge
# To publish to Docker Hub as well, add a docker/login-action step with DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets and list the Docker Hub image in `images:` of the metadata step.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history: the version number is the commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
