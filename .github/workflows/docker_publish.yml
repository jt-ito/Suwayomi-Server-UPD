name: Docker image

# Builds the image from the Dockerfile and pushes it to Docker Hub (jteaito/tsundoku) and to the GitHub
# Container Registry (ghcr.io/jt-ito/tsundoku).
#   v* tag       -> :<version>, :<major>.<minor> and :latest
#   push/manual  -> :edge
# GHCR needs no secrets. Docker Hub is used when the repository has the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (an access token with write permission); without them only GHCR is published.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: "Checkout (full history, the version number is the commit count)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.HAS_DOCKERHUB == 'true' && 'jteaito/tsundoku' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # the Dockerfile clones the WebUI; without this the cached clone from an earlier build would be reused
      - name: Current commit of the WebUI
        id: webui
        run: echo "commit=$(git ls-remote https://github.com/jt-ito/tsundoku-WebUI.git refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: WEBUI_COMMIT=${{ steps.webui.outputs.commit }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
