name: Release

# A v* tag builds the server jar and a ready-to-run archive per platform (Java runtime + jar + the tsundoku-WebUI) and
# publishes them as a GitHub release; that is what the server's update check looks at. The Docker image is published by
# docker_publish.yml on the same tag. "Run workflow" builds everything without publishing, to try the pipeline.
#
# The tag has to equal the version the build reports (v2.3.<commit count>), otherwise installs would compare it with
# a different number and either never or always offer the update.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  WEBUI_REPO: jt-ito/tsundoku-WebUI
  WEBUI_REF: fork-customizations

jobs:
  build:
    name: Build the jar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: "Checkout (full history, the version number is the commit count)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version and check the tag
        id: version
        run: |
          version="v2.3.$(git rev-list HEAD --count)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version of this commit ($version)."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build the jar
        env:
          ProductBuildType: "Stable"
        run: ./gradlew :server:shadowJar --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: server/build/*.jar
          if-no-files-found: error

  webui:
    name: Build the tsundoku-WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the WebUI
        uses: actions/checkout@v7
        with:
          repository: ${{ env.WEBUI_REPO }}
          ref: ${{ env.WEBUI_REF }}
          path: webui

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build
        working-directory: webui
        env:
          CI: "true"
          HUSKY: "0"
        run: |
          corepack enable
          pnpm build
          # the server reads the version of a custom WebUI from this file and shows the splash screen without it
          echo r1 > build/revision

      - name: Upload the WebUI
        uses: actions/upload-artifact@v7
        with:
          name: webui
          path: webui/build
          if-no-files-found: error

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: [build, webui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: macOS-arm64
            os: macos-15
          - name: macOS-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (for the launcher scripts)
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Package a Java runtime
        run: |
          # The modules of a full JRE (jdk.charsets, jdk.localedata, ... are needed by the server); a module a platform's
          # JDK does not have is skipped.
          want="java.base java.compiler java.datatransfer java.desktop java.instrument java.logging java.management java.management.rmi java.naming java.net.http java.prefs java.rmi java.scripting java.se java.security.jgss java.security.sasl java.smartcardio java.sql java.sql.rowset java.transaction.xa java.xml java.xml.crypto jdk.accessibility jdk.attach jdk.charsets jdk.crypto.cryptoki jdk.crypto.ec jdk.dynalink jdk.httpserver jdk.incubator.vector jdk.internal.vm.ci jdk.internal.vm.compiler jdk.internal.vm.compiler.management jdk.jdi jdk.jfr jdk.jsobject jdk.localedata jdk.management jdk.management.agent jdk.management.jfr jdk.naming.dns jdk.naming.rmi jdk.net jdk.nio.mapmode jdk.sctp jdk.security.auth jdk.security.jgss jdk.unsupported jdk.unsupported.desktop jdk.xml.dom jdk.zipfs"
          have="$(java --list-modules | sed 's/@.*//')"
          modules=""
          for m in $want; do
            if echo "$have" | grep -qx "$m"; then modules="$modules,$m"; fi
          done
          # no --strip-debug: with it the server fails to start (the GraphQL class scan finds nothing)
          jlink --add-modules "${modules#,}" --output jre --no-man-pages --no-header-files --compress=zip-6

      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: jar

      - name: Download the WebUI
        uses: actions/download-artifact@v8
        with:
          name: webui
          path: webui

      - name: Assemble and archive
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dir="tsundoku-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp -R jre "$dir/jre"
          cp -R webui "$dir/webUI"
          cp jar/*.jar "$dir/tsundoku.jar"
          case "${{ matrix.name }}" in
            windows-x64)
              cp scripts/tsundoku/tsundoku.bat "$dir/tsundoku.bat"
              7z a -tzip "$dir.zip" "$dir" > /dev/null
              echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
              ;;
            macOS-*)
              cp scripts/tsundoku/tsundoku.sh "$dir/tsundoku.command"
              chmod +x "$dir/tsundoku.command"
              tar -czf "$dir.tar.gz" "$dir"
              echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
            *)
              cp scripts/tsundoku/tsundoku.sh "$dir/tsundoku.sh"
              chmod +x "$dir/tsundoku.sh"
              tar -czf "$dir.tar.gz" "$dir"
              echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [build, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: release

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: cd release && sha256sum * > Checksums.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Unpack an archive and start `tsundoku.bat` (Windows), `tsundoku.command` (macOS) or `tsundoku.sh` (Linux). Each one
            brings its own Java runtime and the tsundoku interface. The plain jar needs JDK 21 and serves the default Suwayomi
            WebUI unless you set `WEB_UI_FLAVOR=CUSTOM` and provide the [tsundoku-WebUI](https://github.com/jt-ito/tsundoku-WebUI) build.
            Docker: `docker pull jteaito/tsundoku:latest`.

            The archives are not signed: Windows SmartScreen and macOS Gatekeeper will ask for confirmation the first time.
