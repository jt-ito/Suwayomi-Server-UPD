name: Release

# A v* tag builds the server jar and publishes it as a GitHub release; that is what the server's update check
# looks at. The Docker image is published by docker_publish.yml on the same tag.
#
# The tag has to equal the version the build reports (v2.3.<commit count>), otherwise installs would compare it with
# a different number and either never or always offer the update.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build jar and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history: the version number is the commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is the build version
        run: |
          expected="v2.3.$(git rev-list HEAD --count)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version of this commit ($expected)."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the jar
        env:
          ProductBuildType: "Stable"
        run: ./gradlew :server:shadowJar --stacktrace

      - name: Checksums
        run: |
          mkdir release
          cp server/build/*.jar release/
          cd release && sha256sum *.jar > Checksums.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            The server jar (needs JDK 21). It serves the default Suwayomi WebUI unless you set `WEB_UI_FLAVOR=CUSTOM`
            and provide the [tsundoku-WebUI](https://github.com/jt-ito/tsundoku-WebUI) build.
            For the complete setup with the tsundoku interface, use the Docker image: `docker pull jteaito/tsundoku:latest`.
