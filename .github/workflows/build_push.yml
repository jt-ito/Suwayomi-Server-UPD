name: CI build

# Compiles the server and runs its tests on every push to master. Releases are made by publish.yml (a v* tag) and
# the Docker image by docker_publish.yml.

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

  build:
    name: Compile and test
    needs: check_wrapper
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (full history, the version number is the commit count)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Compile
        run: ./gradlew :server:compileKotlin :server:compileTestKotlin --stacktrace

      - name: Run tests
        run: ./gradlew :server:test -Pci --stacktrace
